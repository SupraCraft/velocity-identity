name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Velocity 4.2.0 / Java 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up exact Temurin 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
          check-latest: false
          force-download: true

      - name: Record build inputs
        run: |
          chmod +x gradlew
          java --version
          ./gradlew --no-daemon printBuildInputs

      - name: Build and test
        run: ./gradlew --no-daemon clean build -PvelocityVersion=4.2.0

      - name: Prove repeatable artifact bytes
        shell: bash
        run: |
          first="$(sha256sum build/libs/*.jar | awk '{print $1}')"
          rm -rf build
          ./gradlew --no-daemon clean build -PvelocityVersion=4.2.0
          second="$(sha256sum build/libs/*.jar | awk '{print $1}')"
          test "$first" = "$second"
          printf 'artifact_sha256=%s\n' "$second"

  development:
    name: Velocity 4.2.1-SNAPSHOT advisory
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up exact Temurin 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
          check-latest: false
          force-download: true

      - name: Probe current development API
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build -PvelocityVersion=4.2.1-SNAPSHOT
