name: vanillacord-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/vanillacord-integration.yml'
      - 'scripts/vanillacord-integration.sh'
      - 'scripts/vanillacord-client.js'

permissions:
  contents: read

concurrency:
  group: vanillacord-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up exact Temurin 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          check-latest: false
          force-download: true

      - name: Verify and run pinned integration
        run: |
          chmod +x gradlew scripts/vanillacord-integration.sh
          ./gradlew --no-daemon clean build -PvelocityVersion=4.2.0
          scripts/vanillacord-integration.sh
